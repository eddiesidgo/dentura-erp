# PostgreSQL — debe coincidir con docker-compose.yml
spring.datasource.url=jdbc:postgresql://${DENTURA_DB_HOST:localhost}:${DENTURA_DB_PORT:5432}/${DENTURA_DB_NAME:dentura}
spring.datasource.username=${DENTURA_DB_USER:dentura}
spring.datasource.password=${DENTURA_DB_PASSWORD:dentura}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
