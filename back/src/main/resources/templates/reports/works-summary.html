<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title}">Resumen por estado</title>
    <th:block th:replace="~{reports/fragments :: styles}"></th:block>
</head>
<body>
<th:block th:replace="~{reports/fragments :: letterhead}"></th:block>

<div th:if="${#lists.isEmpty(rows)}" class="empty" th:text="${emptyMessage}">Sin datos</div>

<table th:if="${!#lists.isEmpty(rows)}" class="data">
    <thead>
    <tr>
        <th>Estado</th>
        <th class="text-center">Trabajos</th>
        <th class="text-right">Monto total</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="row : ${rows}">
        <td>
            <span class="badge"
                  th:classappend="${row.status == 'COMPLETED'} ? ' badge-completed' : (${row.status == 'REJECTED'} ? ' badge-rejected' : ' badge-pending')"
                  th:text="${row.statusLabel}">Pendiente</span>
        </td>
        <td class="text-center" th:text="${row.count}">0</td>
        <td class="text-right" th:text="${row.total}">$0.00</td>
    </tr>
    </tbody>
</table>

<div class="footer">
    Documento generado por Dentura ERP · <span th:text="${year}">2026</span>
</div>
</body>
</html>
