<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>
<div th:fragment="letterhead">
    <div class="header">
        <div class="header-left">
            <img th:if="${clinic.logoDataUri != null}" th:src="${clinic.logoDataUri}" class="logo" alt="Logo"/>
            <div th:if="${clinic.logoDataUri == null}" class="logo-placeholder" th:text="${#strings.substring(clinic.name,0,1)}">D</div>
            <div class="clinic-meta">
                <div class="clinic-name" th:text="${clinic.name}">Clínica</div>
                <div class="clinic-line" th:if="${clinic.nit != null}" th:text="'NIT ' + ${clinic.nit}">NIT</div>
                <div class="clinic-line" th:if="${clinic.addressLine != null}" th:text="${clinic.addressLine}">Dirección</div>
                <div class="clinic-line" th:if="${clinic.cityLine != null}" th:text="${clinic.cityLine}">Ciudad</div>
                <div class="clinic-line" th:if="${clinic.phone != null}" th:text="${clinic.phone}">Teléfono</div>
                <div class="clinic-line" th:if="${clinic.email != null}" th:text="${clinic.email}">Email</div>
            </div>
        </div>
        <div class="header-right">
            <div class="doc-title" th:text="${title}">Título</div>
            <div class="doc-subtitle" th:if="${subtitle != null}" th:text="${subtitle}">Subtítulo</div>
            <div class="doc-meta">Generado: <span th:text="${generatedAt}">fecha</span></div>
        </div>
    </div>
</div>

<div th:fragment="styles">
    <style>
        @page { size: A4; margin: 18mm 16mm 20mm 16mm; }
        * { box-sizing: border-box; }
        body {
            font-family: 'DejaVu Sans', sans-serif;
            color: #1f2937;
            font-size: 10.5px;
            line-height: 1.45;
            margin: 0;
        }
        .header {
            display: table;
            width: 100%;
            border-bottom: 2px solid #0ea5e9;
            padding-bottom: 14px;
            margin-bottom: 18px;
        }
        .header-left, .header-right {
            display: table-cell;
            vertical-align: top;
        }
        .header-right { text-align: right; width: 38%; }
        .header-left { width: 62%; }
        .logo {
            height: 52px;
            max-width: 110px;
            object-fit: contain;
            float: left;
            margin-right: 12px;
        }
        .logo-placeholder {
            float: left;
            width: 52px;
            height: 52px;
            margin-right: 12px;
            border-radius: 10px;
            background: #e0f2fe;
            color: #0369a1;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            line-height: 52px;
        }
        .clinic-name {
            font-size: 16px;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .clinic-line { color: #64748b; font-size: 9.5px; }
        .doc-title {
            font-size: 15px;
            font-weight: bold;
            color: #0c4a6e;
            margin-bottom: 4px;
        }
        .doc-subtitle { color: #475569; font-size: 9.5px; margin-bottom: 6px; }
        .doc-meta { color: #94a3b8; font-size: 9px; }
        table.data {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }
        table.data th {
            background: #f0f9ff;
            color: #0c4a6e;
            font-size: 9.5px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            padding: 8px 6px;
            border-bottom: 1px solid #bae6fd;
            text-align: left;
        }
        table.data td {
            padding: 7px 6px;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: top;
        }
        table.data tr:nth-child(even) td { background: #f8fafc; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        .muted { color: #64748b; }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 9px;
            font-weight: bold;
        }
        .badge-pending { background: #fef3c7; color: #b45309; }
        .badge-completed { background: #d1fae5; color: #047857; }
        .badge-rejected { background: #fee2e2; color: #b91c1c; }
        .summary-grid {
            display: table;
            width: 100%;
            margin-top: 10px;
        }
        .summary-card {
            display: table-cell;
            width: 33.33%;
            padding: 10px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
        }
        .summary-card + .summary-card { border-left: none; }
        .summary-label { font-size: 9px; color: #64748b; text-transform: uppercase; }
        .summary-value { font-size: 14px; font-weight: bold; color: #0f172a; margin-top: 4px; }
        .footer {
            margin-top: 24px;
            padding-top: 10px;
            border-top: 1px solid #e2e8f0;
            color: #94a3b8;
            font-size: 8.5px;
            text-align: center;
        }
        .empty {
            padding: 28px;
            text-align: center;
            color: #64748b;
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
        }
        .patient-box {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 14px;
        }
        .patient-name { font-size: 13px; font-weight: bold; color: #0c4a6e; }
        .patient-meta { color: #475569; font-size: 9.5px; margin-top: 4px; }
        .totals {
            margin-top: 14px;
            width: 100%;
        }
        .totals td { padding: 6px 8px; }
        .totals .label { color: #475569; }
        .totals .amount { text-align: right; font-weight: bold; }
        .totals .grand td {
            border-top: 2px solid #0ea5e9;
            font-size: 12px;
            color: #0c4a6e;
            padding-top: 10px;
        }
    </style>
</div>
</body>
</html>
