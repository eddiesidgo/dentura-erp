# Tests: H2 in-memory so Maven does not depend on Docker Postgres
spring.datasource.url=jdbc:h2:mem:dentura;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

dentura.jwt.secret=test-secret-key-that-is-long-enough-for-hs256-algorithm-xx
dentura.public-signup-enabled=true
dentura.seed.admin-username=admin
dentura.seed.admin-password=123Qwe
dentura.seed.admin-email=admin@dentura.local
