<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title}">Resumen de pagos</title>
    <th:block th:replace="~{reports/fragments :: styles}"></th:block>
</head>
<body>
<th:block th:replace="~{reports/fragments :: watermark}"></th:block>
<th:block th:replace="~{reports/fragments :: letterhead}"></th:block>

<div th:if="${#lists.isEmpty(rows)}" class="empty" th:text="${emptyMessage}">Sin datos</div>

<table th:if="${!#lists.isEmpty(rows)}" class="summary-cards">
    <tr>
        <td th:each="row : ${rows}">
            <div class="summary-label" th:text="${row.statusLabel}">Efectivo</div>
            <div class="summary-count" th:text="${row.count}">0</div>
            <div class="summary-total" th:text="${row.total}">$0.00</div>
        </td>
    </tr>
</table>

<table th:if="${!#lists.isEmpty(rows)}" class="data" style="margin-top: 18px;">
    <thead>
    <tr>
        <th>Método de pago</th>
        <th class="text-center">Pagos</th>
        <th class="text-right">Monto total</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="row : ${rows}">
        <td class="strong" th:text="${row.statusLabel}">Efectivo</td>
        <td class="text-center strong" th:text="${row.count}">0</td>
        <td class="text-right strong" th:text="${row.total}">$0.00</td>
    </tr>
    </tbody>
</table>

<th:block th:replace="~{reports/fragments :: footer}"></th:block>
</body>
</html>
